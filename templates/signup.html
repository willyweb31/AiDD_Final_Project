{% extends "base.html" %}
{% block title %}Create an account · MyCarAI{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  <p class="muted">Get plain answers about your car, straight from its owner's manual.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('signup') }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
    <label for="password">Password <span class="muted">(at least 8 characters)</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</section>
{% endblock %}
