{% extends "base.html" %}
{% block title %}Sign in · MyCarAI{% endblock %}
{% block content %}
<section class="card narrow hero-card">
  <h1>Sign in</h1>
  <p class="muted">Plain answers about your car, straight from its owner's manual.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
